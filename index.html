<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>History Guesser</title>
        <script src="https://www.runningreality.org/lib/rr.js"></script>
        <style>
            .rr-embedded {
                position: relative;
                width: 100%;
                height: 400px;
                margin: auto;
            }

            #game-container {
                margin: 1rem;
            }

            #year-input {
                width: 100%;
            }
            
            /* Hide unwanted parts of the UI */
            #rrmap {inset:0px !important;top:0px;}
            #rrtimeline {display:none !important;}
            #rrsidebar {display:none;}
            .ol-location-control {display: none;}
            #jAROpen{display:none;}

            /* Undo extra CSS from running reality */
            #hard-mode {
                position: static;
                left: auto;
                visibility: unset;
            }

            .thumb {
                display: none;
            }
        </style>
    </head>
    <body>
        <script>
            const EASY_MIN_YEAR = 1900;
            const HARD_MIN_YEAR = -3300;

            // Prevent the title from changing which would spoil the answer
            const originalTitle = document.title;

            Object.defineProperty(document, "title", {
                get() {
                    return originalTitle;
                },
                set(value) {
                    console.warn("Blocked title change to avoid spoiling the answer");
                }
            });

            // Prevent changes to the URL which would spoil the answer
            window.navigation.addEventListener("navigate", (event) => {
                console.warn("Blocked location change to avoid spoiling the answer");
                event.preventDefault();
            })

            let yearAnswer = 0;

            let hardMode = false;
            let minYear = EASY_MIN_YEAR;
            const today = new Date();
            const maxYear = today.getFullYear();

            function formatYear(showSuffix, year) {
                if (showSuffix) {
                    return year < 0 ? `${Math.abs(year)} BC` : `${year} AD`;
                }
                else {
                    return year;
                }
            }

            function changeToRandomYear() {
                const loadingElement = document.getElementById("loading");
                const gameElement = document.getElementById("game-container");
                gameElement.style.visibility = "hidden";
                loadingElement.style.visibility = "visible";

                yearAnswer = Math.floor(Math.random() * (maxYear - minYear + 1)) + minYear;

                const day = today.getDate();
                const month = today.getMonth();
                const date = `${month}/${day}/${yearAnswer}`;

                rr.setDate(date);

                // Wait for the UI to render
                loadingElement.style.visibility = "hidden";
                gameElement.style.visibility = "visible";
            }

            function updateInputValues(inputElement, yearValueElement) {
                inputElement.setAttribute("min", minYear);
                inputElement.setAttribute("max", maxYear);
                inputElement.value = maxYear;
                yearValueElement.innerHTML = formatYear(minYear < 0, maxYear);
            }

            window.onload = function () { setTimeout(function() {
                const hardModeLabelElement = document.getElementById("hard-mode-label");

                const hardModeText = formatYear(HARD_MIN_YEAR < 0, HARD_MIN_YEAR);
                hardModeLabelElement.innerHTML = `Hard Mode (${hardModeText} to present)`;
                const difficultyCheckboxElement = document.getElementById("hard-mode");
                const buttonElement = document.getElementById("guess-button");
                const inputElement = document.getElementById("year-input");
                const yearValueElement = document.getElementById("year-value");
                updateInputValues(inputElement, yearValueElement);

                inputElement.oninput = (event) => {
                    yearValueElement.innerHTML = formatYear(minYear < 0, event.target.value);
                }

                changeToRandomYear();

                buttonElement.onclick = () => {
                    const yearGuess = inputElement.value;
                    const yearAnswerFormatted = formatYear(minYear < 0, yearAnswer);

                    if (yearGuess == yearAnswer) {
                        alert(`Correct! The answer was ${yearAnswerFormatted}.`)
                    }
                    else {
                        alert(`Sorry! You guessed ${yearValueElement.innerHTML}. The correct answer was ${yearAnswerFormatted}.`);
                    }

                    updateInputValues(inputElement, yearValueElement);

                    changeToRandomYear();
                };

                difficultyCheckboxElement.onchange = (event) => {
                    hardMode = event.currentTarget.checked;

                    minYear = hardMode ? HARD_MIN_YEAR : EASY_MIN_YEAR;

                    updateInputValues(inputElement, yearValueElement);

                    changeToRandomYear();
                } 

                buttonElement.disabled = false;
            }, 2000);};
        </script>
        <h1>History Guesser</h1>
        <div id="loading">Loading...</div>
        <div id="game-container" style="visibility: hidden">
            <h2>Settings</h2>
            <label id="hard-mode-label" for="hard-mode"></label>
            <input id="hard-mode" type="checkbox"/>
            <div id="rr-embedded"><!-- RR Map will be injected here --></div>
            <p>Map powered by https://www.runningreality.org/</p>
            <label for="year-input">Year</label>
            <input id="year-input" type="range">
            <div id="year-value"></div>
            <br />
            <button id="guess-button" disabled>Submit Guess</button>
        </div>
    </body>
</html>
